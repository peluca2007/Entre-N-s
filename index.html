<!doctype html>
<html lang="pt-BR" data-theme="leve">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6ee">
  <title>Entre Nós — um jogo para dois</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Great+Vibes&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div id="bursts" aria-hidden="true"></div>

  <main>
    <!-- ============ INÍCIO ============ -->
    <section id="screen-start" class="screen active">
      <p class="eyebrow" id="eyebrow">um jogo para dois</p>
      <h1 class="title">Entre <span>Nós</span></h1>
      <div class="beat" data-theme-icon aria-hidden="true"></div>
      <p class="lead" id="lead"></p>

      <form id="start-form" autocomplete="off" novalidate>
        <p class="section-label">Qual é a vibe de hoje?</p>
        <div id="themes" class="themes" role="radiogroup" aria-label="Tema do jogo"></div>

        <div class="names">
          <label class="field">
            <span>Primeira pessoa</span>
            <input id="name1" type="text" maxlength="18" placeholder="Seu nome">
          </label>
          <span class="amp" aria-hidden="true">&amp;</span>
          <label class="field">
            <span>Segunda pessoa</span>
            <input id="name2" type="text" maxlength="18" placeholder="O nome da outra pessoa">
          </label>
        </div>

        <p class="section-label">Baralhos</p>
        <div id="cats" class="cats"></div>
        <p id="cats-error" class="error" role="alert" hidden>Escolham pelo menos um baralho</p>

        <div class="switches">
          <label class="switch">
            <input id="surprises" type="checkbox" checked>
            <span class="track" aria-hidden="true"><i></i></span>
            <span class="switch-text"><b><span data-icon="dice"></span>Cartas surpresa</b><small>mini-jogos e regras malucas no meio</small></span>
          </label>
          <label class="switch">
            <input id="sips" type="checkbox" checked>
            <span class="track" aria-hidden="true"><i></i></span>
            <span class="switch-text"><b><span data-icon="cheers"></span>Gole ou trago</b><small>bebida e brisa no jogo (desliga e some tudo)</small></span>
          </label>
          <label class="switch">
            <input id="games" type="checkbox" checked>
            <span class="track" aria-hidden="true"><i></i></span>
            <span class="switch-text"><b><span data-icon="palette"></span>Mini-jogos no meio</b><small>adivinha a cor e roleta do encontro</small></span>
          </label>
        </div>

        <button class="btn primary big" type="submit">Embaralhar e começar</button>
      </form>
    </section>

    <!-- ============ JOGO ============ -->
    <section id="screen-game" class="screen">
      <header class="topbar">
        <div class="progress">
          <span id="progress-text">0 / 0</span>
          <div class="bar"><i id="progress-bar"></i></div>
        </div>
        <div class="top-actions">
          <button id="btn-games" class="btn ghost small" type="button"><span data-icon="dice"></span> Mini-jogos</button>
          <button id="btn-quit" class="btn ghost small" type="button">Encerrar</button>
        </div>
      </header>

      <div class="stage" id="stage">
        <div class="card" id="card" role="button" tabindex="0" aria-label="Virar a carta">
          <div class="float">
            <div class="card-inner">
              <div class="face back">
                <div class="back-frame">
                  <div class="back-sym" id="back-sym"></div>
                  <div class="back-text">Entre Nós</div>
                </div>
              </div>
              <div class="face front">
                <div class="front-cat" id="card-cat"></div>
                <div class="orn" id="card-icon" aria-hidden="true"></div>
                <p class="front-text" id="card-text"></p>
                <div class="front-turn">
                  <small id="card-label"></small>
                  <strong id="card-name"></strong>
                  <em id="card-hint"></em>
                  <span class="pass" id="card-pass" hidden></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="btn-fav" class="btn round" type="button" aria-pressed="false" aria-label="Guardar esta carta" disabled>
          <span aria-hidden="true">☆</span>
        </button>
        <button id="btn-next" class="btn primary" type="button">Virar a primeira carta</button>
      </div>
      <p class="tip" id="tip">Toque na carta ou aperte espaço</p>
    </section>

    <!-- ============ FIM ============ -->
    <section id="screen-end" class="screen">
      <p class="eyebrow">fim de jogo</p>
      <h2 class="title small">Que conversa <span>boa</span></h2>
      <div class="beat" data-theme-icon aria-hidden="true"></div>
      <p class="lead" id="end-summary"></p>

      <div id="fav-wrap" hidden>
        <p class="section-label">Cartas que vocês guardaram</p>
        <ul id="fav-list" class="fav-list"></ul>
      </div>

      <div class="end-actions">
        <button id="btn-again" class="btn primary" type="button">Embaralhar de novo</button>
        <button id="btn-home" class="btn ghost" type="button">Trocar a vibe</button>
      </div>
    </section>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/decks/leve.js"></script>
  <script src="js/decks/papo.js"></script>
  <script src="js/decks/resenha.js"></script>
  <script src="js/decks/romance.js"></script>
  <script src="js/decks/brisa.js"></script>
  <script src="js/decks/extras.js"></script>
  <div id="mg" class="mg" hidden></div>

  <script src="js/app.js"></script>
  <script src="js/minigames.js"></script>
</body>
</html>
